<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire BP104 - Link & Ảnh</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 2rem;
    background: linear-gradient(90deg, #f97316, #ef4444, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 30px;
    font-size: 0.95rem;
  }
  .stats {
    text-align: center;
    margin-bottom: 25px;
    color: #64748b;
    font-size: 0.9rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(249, 115, 22, 0.2);
    border-color: #f97316;
  }
  .card-header {
    padding: 10px 14px;
    background: #0f172a;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .filename {
    font-size: 0.8rem;
    color: #f97316;
    font-weight: 600;
    font-family: 'Courier New', monospace;
    word-break: break-all;
  }
  .index {
    background: #f97316;
    color: #0f172a;
    font-weight: 700;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .img-wrapper {
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 180px;
    padding: 10px;
    position: relative;
  }
  .img-wrapper img {
    max-width: 100%;
    max-height: 260px;
    object-fit: contain;
    display: block;
    border-radius: 6px;
    transition: opacity 0.3s;
    opacity: 0;
  }
  .img-wrapper img.loaded { opacity: 1; }
  .img-wrapper img.error { display: none; }
  .error-msg {
    color: #ef4444;
    font-size: 0.8rem;
    text-align: center;
    padding: 20px;
    display: none;
  }
  .error-msg.show { display: block; }
  .loader {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 3px solid #334155;
    border-top-color: #f97316;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loader.hide { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card-footer {
    padding: 10px 14px;
    border-top: 1px solid #334155;
    display: flex;
    gap: 8px;
  }
  .btn {
    flex: 1;
    text-align: center;
    padding: 7px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    border-radius: 6px;
    text-decoration: none;
    transition: background 0.2s;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .btn-open {
    background: #f97316;
    color: #0f172a;
  }
  .btn-open:hover { background: #fb923c; }
  .btn-copy {
    background: #334155;
    color: #e2e8f0;
  }
  .btn-copy:hover { background: #475569; }
  .btn-copy.copied {
    background: #22c55e;
    color: #fff;
  }
  @media (max-width: 600px) {
    h1 { font-size: 1.4rem; }
    .grid { grid-template-columns: 1fr; gap: 15px; }
  }
</style>
</head>
<body>

<h1>🔥 Free Fire BP104 Gallery</h1>
<p class="subtitle">Danh sách link & ảnh Battle Pass 104</p>
<p class="stats" id="stats">Đang tải...</p>

<div class="grid" id="grid"></div>

<script>
const urls = [
  "https://dl-tata.freefireind.in/common/OB56/CSH/BP104/BP_Prize_104.png",
  "https://dl-tata.freefireind.in/common/OB56/CSH/BP104/BP_Task_FP_104.png",
  "https://dl-tata.freefireind.in/common/OB56/CSH/BP104/BP_104.png",
  "https://dl-tata.freefireind.in/common/OB56/CSH/BP104/BP_Window_PP_104.png",
  "https://dl-tata.freefireind.in/common/OB56/CSH/BP104/BP_Premium_icon_104.png",
  "https://dl-tata.freefireind.in/common/OB56/CSH/BP104/BP_Icon_free_104.png",
  "https://dl-tata.freefireind.in/common/OB56/CSH/BP104/subtype36_104.png",
  "https://dl-tata.freefireind.in/common/OB56/CSH/BP104/subtype1_104.jpg",
  "https://dl-tata.freefireind.in/common/OB56/CSH/BP104/subtype2_104.jpg",
  "https://dl-tata.freefireind.in/common/OB56/CSH/BP104/subtype3_104.jpg",
  "https://dl.dir.freefiremobile.com/common/OB56/CSH/BP104/subtype7_104.jpg",
  "https://dl.dir.freefiremobile.com/common/OB56/CSH/BP104/BP_Premium_title_104.png",
  "https://dl.dir.freefiremobile.com/common/OB56/CSH/BP104/BP_GRANDPrize01_104.jpg",
  "https://dl.dir.freefiremobile.com/common/OB56/CSH/BP104/BP_GRANDPrize02_104.jpg",
  "https://dl.dir.freefiremobile.com/common/OB56/CSH/BP104/BP_GRANDPrize03_104.jpg",
  "https://dl.dir.freefiremobile.com/common/OB56/CSH/BP104/BP_GRANDPrize04_104.jpg",
  "https://dl.dir.freefiremobile.com/common/OB56/CSH/BP104/BP_GRANDPrize05_104.jpg",
  "https://dl.dir.freefiremobile.com/common/OB56/CSH/BP104/BP_GRANDPrize06_104.jpg"
];

const grid = document.getElementById('grid');
const stats = document.getElementById('stats');

let loadedCount = 0;
let errorCount = 0;

urls.forEach((url, i) => {
  const filename = url.split('/').pop();

  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="card-header">
      <span class="filename">${filename}</span>
      <span class="index">#${i + 1}</span>
    </div>
    <div class="img-wrapper">
      <div class="loader" id="loader-${i}"></div>
      <img src="${url}" alt="${filename}" loading="lazy" id="img-${i}">
      <div class="error-msg" id="err-${i}">⚠️ Không tải được ảnh</div>
    </div>
    <div class="card-footer">
      <a class="btn btn-open" href="${url}" target="_blank" rel="noopener">🔗 Mở link</a>
      <button class="btn btn-copy" data-url="${url}">📋 Copy</button>
    </div>
  `;

  const img = card.querySelector(`#img-${i}`);
  const loader = card.querySelector(`#loader-${i}`);
  const err = card.querySelector(`#err-${i}`);

  img.addEventListener('load', () => {
    loader.classList.add('hide');
    img.classList.add('loaded');
    loadedCount++;
    updateStats();
  });

  img.addEventListener('error', () => {
    loader.classList.add('hide');
    err.classList.add('show');
    errorCount++;
    updateStats();
  });

  card.querySelector('.btn-copy').addEventListener('click', function() {
    navigator.clipboard.writeText(url).then(() => {
      this.classList.add('copied');
      const originalText = this.textContent;
      this.textContent = '✅ Đã copy';
      setTimeout(() => {
        this.classList.remove('copied');
        this.textContent = originalText;
      }, 1500);
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      this.classList.add('copied');
      const t = this.textContent;
      this.textContent = '✅ Đã copy';
      setTimeout(() => {
        this.classList.remove('copied');
        this.textContent = t;
      }, 1500);
    });
  });

  grid.appendChild(card);
});

function updateStats() {
  const done = loadedCount + errorCount;
  if (done === urls.length) {
    stats.textContent = `✅ Tải xong: ${loadedCount}/${urls.length} ảnh` +
      (errorCount > 0 ? ` • ⚠️ ${errorCount} ảnh lỗi` : '');
  } else {
    stats.textContent = `Đang tải... ${done}/${urls.length} • ✅ ${loadedCount} • ❌ ${errorCount}`;
  }
}
updateStats();
</script>

</body>
</html>
