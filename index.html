<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Booyah Pass — BP104 &amp; BP105</title>

<link rel="preload" as="font" type="font/woff2" crossorigin
      href="https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff2">

<style>
  @font-face{
    font-family:"GFF-Latin-Bold";
    src:url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
    font-display:block; font-weight:700;
  }
  @font-face{
    font-family:"GFF-Latin-Black";
    src:url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff2") format("woff2"),
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff") format("woff");
    font-display:block; font-weight:900;
  }

  :root{
    --font-heading:"GFF-Latin-Bold","Arial Black","Impact",sans-serif;
    --font-black:"GFF-Latin-Black","GFF-Latin-Bold","Arial Black",sans-serif;
    --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;

    --red:#d93828;
    --red-light:#ff5a46;
    --red-glow:#ff7a5c;
    --red-dark:#b52a1c;

    --ink:#0f172a;
    --ink-2:#334155;
    --ink-3:#64748b;

    --bg-main:#eef2f6;
    --grid-color:rgba(0,0,0,0.07);
  }

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  html{
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    scrollbar-gutter:stable;
    scroll-behavior:smooth;
  }

  body{
    font-family:var(--font-body);
    color:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    width:100%;
    background-color:var(--bg-main);
    background-image:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(217,56,40,.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255,122,92,.08) 0%, transparent 60%),
      linear-gradient(var(--grid-color) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);
    background-size:auto, auto, 32px 32px, 32px 32px;
    background-position:center top;
    background-attachment:fixed;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }

  img,svg{-webkit-user-drag:none}
  svg{pointer-events:none}
  a,button{cursor:pointer}
  h1,h2,h3{font-family:var(--font-heading);font-weight:700}

  /* ============ PAGE ============ */
  .page{
    position:relative;
    z-index:1;
    max-width:900px;
    margin:0 auto;
    padding:clamp(20px,4vh,44px) 16px 60px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* ============ HEADER BRAND ============ */
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:4px 0 6px;
    animation:brandIn .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes brandIn{
    from{opacity:0;transform:translateY(-8px)}
    to{opacity:1;transform:translateY(0)}
  }
  .brand-mark{
    display:grid;
    place-items:center;
    width:44px;
    height:44px;
    border-radius:12px;
    background:linear-gradient(135deg,#ff5a46 0%, var(--red) 50%, var(--red-dark) 100%);
    color:#fff;
    font-family:var(--font-black);
    font-weight:900;
    font-size:17px;
    letter-spacing:-.5px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 10px 24px -10px rgba(217,56,40,.6);
    position:relative;
    overflow:hidden;
  }
  .brand-mark::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:conic-gradient(from 0deg, transparent, rgba(255,255,255,.4), transparent 30%);
    animation:brandSpin 6s linear infinite;
  }
  @keyframes brandSpin{to{transform:rotate(360deg)}}
  .brand-mark span{position:relative;z-index:1}

  .brand-text{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand-name{
    font-family:var(--font-black);
    font-weight:900;
    font-size:16px;
    letter-spacing:3px;
    color:var(--ink);
    line-height:1;
  }
  .brand-sub{
    font-family:var(--font-heading);
    font-weight:700;
    font-size:9.5px;
    letter-spacing:2.5px;
    color:var(--red);
    text-transform:uppercase;
    line-height:1;
  }

  /* ============ TABS ============ */
  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    padding:6px;
    background:rgba(255,255,255,.42);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    backdrop-filter:blur(26px) saturate(180%);
    border:1px solid rgba(255,255,255,.65);
    border-radius:18px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 12px 32px -18px rgba(15,23,42,.3);
    position:sticky;
    top:10px;
    z-index:20;
  }
  .tab{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:13px 12px;
    border:1px solid transparent;
    background:transparent;
    border-radius:13px;
    font-family:var(--font-heading);
    font-weight:700;
    font-size:12px;
    letter-spacing:1.4px;
    color:var(--ink-2);
    cursor:pointer;
    transition:background .3s, color .3s, border-color .3s, box-shadow .3s, transform .2s;
    text-transform:uppercase;
    position:relative;
  }
  .tab:hover{background:rgba(255,255,255,.4)}
  .tab:active{transform:scale(.985)}
  .tab.is-active{
    background:linear-gradient(135deg,#ff5a46 0%, var(--red) 50%, var(--red-dark) 100%);
    color:#fff;
    border-color:rgba(255,255,255,.4);
    box-shadow:
      0 1px 0 rgba(255,255,255,.35) inset,
      0 10px 24px -10px rgba(217,56,40,.65);
  }
  .tab-num{
    display:inline-grid;place-items:center;
    min-width:27px;height:27px;padding:0 8px;
    border-radius:8px;
    font-family:var(--font-black);font-weight:900;
    font-size:11px;line-height:1;
    background:rgba(15,23,42,.08);
    color:inherit;
    transition:background .3s;
  }
  .tab.is-active .tab-num{background:rgba(255,255,255,.3)}
  .tab-text{white-space:nowrap}

  /* ============ PANEL ============ */
  .panel{display:none}
  .panel.is-active{
    display:block;
    animation:panelIn .4s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes panelIn{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ============ PANEL TITLE ============ */
  .panel-title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:16px;
    padding:16px 20px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.22) 100%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.65);
    border-radius:16px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 12px 32px -20px rgba(15,23,42,.28);
    position:relative;
    overflow:hidden;
  }
  .panel-title::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg, var(--red-dark), var(--red), var(--red-light), var(--red), var(--red-dark));
    background-size:200% 100%;
    animation:titleSweep 4s ease-in-out infinite;
  }
  @keyframes titleSweep{
    0%,100%{background-position:0% 0%}
    50%{background-position:100% 0%}
  }
  .panel-title::after{
    content:"";
    position:absolute;
    top:0;left:10%;right:10%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
  }
  .panel-title h2{
    font-family:var(--font-black);
    font-weight:900;
    font-size:16px;
    letter-spacing:2.5px;
    color:var(--ink);
    text-transform:uppercase;
    text-align:center;
    line-height:1.2;
  }
  .title-badge{
    display:grid;
    place-items:center;
    min-width:48px;
    height:34px;
    padding:0 11px;
    font-family:var(--font-black);
    font-weight:900;
    font-size:14px;
    letter-spacing:.5px;
    color:#fff;
    background:linear-gradient(135deg,#ff5a46 0%, var(--red) 50%, var(--red-dark) 100%);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    box-shadow:0 5px 14px -5px rgba(217,56,40,.6);
    flex:0 0 auto;
  }

  /* ============ GRID ============ */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
    gap:14px;
  }

  /* ============ ITEM ============ */
  .item{
    display:flex;
    flex-direction:column;
    gap:9px;
    padding:11px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.22) 100%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.65);
    border-radius:15px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 8px 22px -14px rgba(15,23,42,.28);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;
    animation:itemIn .55s cubic-bezier(.2,.8,.2,1) both;
    position:relative;
  }
  .item:hover{
    transform:translateY(-4px);
    border-color:rgba(217,56,40,.4);
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 20px 36px -18px rgba(217,56,40,.4);
  }
  @keyframes itemIn{
    from{opacity:0;transform:translateY(12px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  /* Image */
  .item-media{
    position:relative;
    display:block;
    width:100%;
    aspect-ratio:1;
    border-radius:11px;
    overflow:hidden;
    background:
      repeating-conic-gradient(rgba(0,0,0,.03) 0% 25%,transparent 0% 50%) 50% / 12px 12px,
      linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.3));
    border:1px solid rgba(255,255,255,.7);
    text-decoration:none;
    cursor:zoom-in;
  }
  .item-media img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    padding:5px;
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .item-media:hover img{transform:scale(1.07)}

  .item-media .pending{
    display:none;
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px;
    font-family:var(--font-heading);
    font-weight:700;
    font-size:9.5px;
    letter-spacing:1px;
    line-height:1.4;
    color:var(--red);
    text-transform:uppercase;
    background:
      linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.72));
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
  }
  .item-media.is-error img{display:none}
  .item-media.is-error .pending{display:flex}

  /* Action buttons */
  .item-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
  }

  .btn-action{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:10px 8px;
    border:none;
    border-radius:10px;
    font-family:var(--font-heading);
    font-weight:700;
    font-size:10.5px;
    letter-spacing:1.3px;
    text-transform:uppercase;
    cursor:pointer;
    transition:transform .2s, filter .2s, box-shadow .2s, background .2s;
    position:relative;
    overflow:hidden;
    text-decoration:none;
    white-space:nowrap;
  }
  .btn-action::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    transform:translateX(-100%);
    transition:transform .65s ease;
  }
  .btn-action:hover::before{transform:translateX(100%)}
  .btn-action:active{transform:translateY(0) scale(.97)}
  .btn-action svg{
    width:12px;
    height:12px;
    fill:none;
    stroke:currentColor;
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    flex:0 0 auto;
  }

  .btn-view{
    background:rgba(255,255,255,.6);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    color:var(--ink);
    border:1px solid rgba(15,23,42,.12);
    box-shadow:0 2px 10px -4px rgba(15,23,42,.22);
  }
  .btn-view:hover{
    transform:translateY(-1px);
    background:rgba(255,255,255,.82);
    filter:brightness(1.02);
    box-shadow:0 8px 16px -6px rgba(15,23,42,.3);
  }

  .btn-dl{
    background:linear-gradient(135deg,#ff5a46 0%, var(--red) 50%, var(--red-dark) 100%);
    color:#fff;
    box-shadow:0 5px 14px -5px rgba(217,56,40,.6);
  }
  .btn-dl:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
    box-shadow:0 10px 22px -8px rgba(217,56,40,.75);
  }
  .btn-dl.is-loading{pointer-events:none;opacity:.75}

  /* ============ MODAL (LIGHTBOX) ============ */
  .modal{
    position:fixed;
    inset:0;
    z-index:999;
    display:grid;
    place-items:center;
    padding:16px;
    background:rgba(15,23,42,.72);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .3s ease, visibility .3s;
  }
  .modal.is-open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
  .modal-inner{
    position:relative;
    max-width:min(90vw, 720px);
    max-height:88vh;
    width:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:14px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.08) 100%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    backdrop-filter:blur(40px) saturate(180%);
    border:1px solid rgba(255,255,255,.22);
    border-radius:20px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.35) inset,
      0 30px 60px -20px rgba(0,0,0,.6);
    transform:scale(.94) translateY(10px);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .modal.is-open .modal-inner{
    transform:scale(1) translateY(0);
  }

  .modal-media{
    position:relative;
    display:grid;
    place-items:center;
    border-radius:12px;
    overflow:hidden;
    background:
      repeating-conic-gradient(rgba(255,255,255,.06) 0% 25%,transparent 0% 50%) 50% / 16px 16px,
      rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.15);
    max-height:72vh;
  }
  .modal-media img{
    display:block;
    max-width:100%;
    max-height:72vh;
    object-fit:contain;
    padding:10px;
  }
  .modal-media .pending{
    display:none;
    padding:40px 24px;
    font-family:var(--font-heading);
    font-weight:700;
    font-size:12px;
    letter-spacing:1.5px;
    color:#fff;
    text-transform:uppercase;
    text-align:center;
  }
  .modal-media.is-error img{display:none}
  .modal-media.is-error .pending{display:block}

  /* Modal close btn */
  .modal-close{
    position:absolute;
    top:-14px;
    right:-14px;
    z-index:3;
    display:grid;
    place-items:center;
    width:40px;
    height:40px;
    border-radius:50%;
    background:linear-gradient(135deg, #ff5a46 0%, var(--red) 50%, var(--red-dark) 100%);
    border:2px solid rgba(255,255,255,.4);
    color:#fff;
    cursor:pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 10px 24px -8px rgba(0,0,0,.5),
      0 0 0 6px rgba(255,255,255,.08);
    transition:transform .25s cubic-bezier(.2,.8,.2,1), filter .25s, box-shadow .25s;
  }
  .modal-close:hover{
    transform:rotate(90deg) scale(1.08);
    filter:brightness(1.1);
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 14px 28px -8px rgba(0,0,0,.55),
      0 0 0 8px rgba(255,255,255,.12);
  }
  .modal-close:active{transform:rotate(90deg) scale(.95)}
  .modal-close svg{
    width:18px;
    height:18px;
    fill:none;
    stroke:#fff;
    stroke-width:2.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* Modal footer */
  .modal-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:0 4px;
  }
  .modal-file{
    font-family:var(--font-body);
    font-weight:600;
    font-size:11px;
    letter-spacing:.5px;
    color:rgba(255,255,255,.85);
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .modal-dl{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:9px 16px;
    border:none;
    border-radius:9px;
    font-family:var(--font-heading);
    font-weight:700;
    font-size:11px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:#fff;
    background:linear-gradient(135deg, #ff5a46 0%, var(--red) 50%, var(--red-dark) 100%);
    box-shadow:0 5px 14px -5px rgba(217,56,40,.6);
    cursor:pointer;
    transition:transform .2s, filter .2s, box-shadow .2s;
    flex:0 0 auto;
    position:relative;
    overflow:hidden;
  }
  .modal-dl::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
    transform:translateX(-100%);
    transition:transform .65s ease;
  }
  .modal-dl:hover::before{transform:translateX(100%)}
  .modal-dl:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
    box-shadow:0 10px 22px -8px rgba(217,56,40,.75);
  }
  .modal-dl.is-loading{pointer-events:none;opacity:.75}
  .modal-dl svg{
    width:13px;
    height:13px;
    fill:none;
    stroke:#fff;
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* ============ FOOTER ============ */
  .page-footer{
    padding:18px 18px 0;
    text-align:center;
    margin-top:10px;
    position:relative;
  }
  .page-footer::before{
    content:"";
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:56px;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--red), transparent);
    border-radius:2px;
  }
  .page-footer .note{
    font-family:var(--font-heading);
    font-size:11px;
    font-weight:700;
    letter-spacing:2.2px;
    color:var(--ink-2);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .page-footer .copy{
    font-family:var(--font-body);
    font-size:10px;
    font-weight:500;
    letter-spacing:1.4px;
    color:var(--ink-3);
    text-transform:uppercase;
  }
  .page-footer .copy strong{
    font-family:var(--font-black);
    font-weight:900;
    color:var(--red);
    letter-spacing:1.8px;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:520px){
    .page{padding:14px 12px 46px;gap:16px}

    .brand{gap:11px}
    .brand-mark{width:38px;height:38px;font-size:15px;border-radius:10px}
    .brand-name{font-size:14px;letter-spacing:2.4px}
    .brand-sub{font-size:8.5px;letter-spacing:2px}

    .tabs{top:8px;padding:5px;border-radius:15px;gap:5px}
    .tab{padding:11px 8px;font-size:11px;letter-spacing:1.1px;gap:7px;border-radius:11px}
    .tab-num{min-width:23px;height:23px;font-size:10px;padding:0 6px;border-radius:7px}

    .panel-title{padding:13px 14px;gap:10px;margin-bottom:13px;border-radius:14px}
    .panel-title h2{font-size:13.5px;letter-spacing:1.8px}
    .title-badge{min-width:40px;height:28px;font-size:12px;padding:0 8px}

    .grid{grid-template-columns:repeat(2, minmax(0,1fr));gap:10px}
    .item{padding:9px;gap:7px;border-radius:13px}
    .item-actions{gap:5px}
    .btn-action{padding:8px 6px;font-size:9.5px;letter-spacing:1px;gap:4px;border-radius:9px}
    .btn-action svg{width:11px;height:11px}
    .item-media .pending{font-size:8.5px;padding:6px}

    .modal{padding:10px}
    .modal-inner{padding:10px;border-radius:16px;gap:10px;max-width:100%}
    .modal-close{top:-8px;right:-8px;width:34px;height:34px}
    .modal-close svg{width:15px;height:15px}
    .modal-media img{padding:6px;max-height:66vh}
    .modal-file{font-size:10px}
    .modal-dl{padding:8px 12px;font-size:10px;letter-spacing:1.2px}
    .modal-dl svg{width:11px;height:11px}

    .page-footer .note{font-size:10px;letter-spacing:1.8px}
    .page-footer .copy{font-size:9px;letter-spacing:1.2px}
  }

  @media (max-width:360px){
    .grid{grid-template-columns:1fr}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>

<body>

  <main class="page">

    <!-- BRAND -->
    <header class="brand">
      <div class="brand-mark"><span>BP</span></div>
      <div class="brand-text">
        <span class="brand-name">BOOYAH PASS</span>
        <span class="brand-sub">Links &amp; Images Gallery</span>
      </div>
    </header>

    <!-- TABS -->
    <div class="tabs" role="tablist" aria-label="Chọn Booyah Pass">
      <button class="tab is-active" data-tab="t1" role="tab" aria-selected="true" aria-controls="panel-t1" type="button">
        <span class="tab-num">104</span>
        <span class="tab-text">BOOYAH T1</span>
      </button>
      <button class="tab" data-tab="t2" role="tab" aria-selected="false" aria-controls="panel-t2" type="button">
        <span class="tab-num">105</span>
        <span class="tab-text">BOOYAH T2</span>
      </button>
    </div>

    <!-- PANEL T1 -->
    <section class="panel is-active" id="panel-t1" role="tabpanel">
      <header class="panel-title">
        <span class="title-badge">104</span>
        <h2>THẺ BOOYAH THÁNG 1</h2>
      </header>
      <div class="grid" id="grid-t1"></div>
    </section>

    <!-- PANEL T2 -->
    <section class="panel" id="panel-t2" role="tabpanel">
      <header class="panel-title">
        <span class="title-badge">105</span>
        <h2>THẺ BOOYAH THÁNG 2</h2>
      </header>
      <div class="grid" id="grid-t2"></div>
    </section>

    <!-- FOOTER -->
    <footer class="page-footer">
      <p class="note">BOOYAH PASS</p>
      <p class="copy">© 2026 <strong>AZERST</strong></p>
    </footer>

  </main>

  <!-- ============ MODAL ============ -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalFile" aria-hidden="true">
    <div class="modal-inner">
      <button class="modal-close" id="modalClose" type="button" aria-label="Đóng">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
      <div class="modal-media" id="modalMedia">
        <img id="modalImg" src="" alt="" />
        <div class="pending">Đang cập nhật</div>
      </div>
      <div class="modal-footer">
        <span class="modal-file" id="modalFile">image.png</span>
        <button class="modal-dl" id="modalDl" type="button" aria-label="Tải xuống">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12M6 11l6 6 6-6M5 21h14"/>
          </svg>
          Tải xuống
        </button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       DATA
    ========================================================= */
    const BP104 = [
      'BP_Prize_104.png',
      'BP_Task_FP_104.png',
      'BP_104.png',
      'BP_Window_PP_104.png',
      'BP_Premium_icon_104.png',
      'BP_Icon_free_104.png',
      'subtype36_104.jpg',
      'subtype1_104.jpg',
      'subtype2_104.jpg',
      'subtype3_104.jpg',
      'subtype7_104.jpg',
      'BP_Premium_title_104.png',
      'BP_GRANDPrize01_104.jpg',
      'BP_GRANDPrize02_104.jpg',
      'BP_GRANDPrize03_104.jpg',
      'BP_GRANDPrize04_104.jpg',
      'BP_GRANDPrize05_104.jpg',
      'BP_GRANDPrize06_104.jpg'
    ];

    const BP105 = [
      'BP_Prize_105.png',
      'BP_Task_FP_105.png',
      'BP_105.png',
      'BP_Window_PP_105.png',
      'BP_Premium_icon_105.png',
      'BP_Icon_free_105.png',
      'subtype36_105.jpg',
      'subtype1_105.jpg',
      'subtype2_105.jpg',
      'subtype3_105.jpg',
      'subtype7_105.jpg',
      'BP_Premium_title_105.png',
      'BP_GRANDPrize01_105.jpg',
      'BP_GRANDPrize02_105.jpg',
      'BP_GRANDPrize03_105.jpg',
      'BP_GRANDPrize04_105.jpg',
      'BP_GRANDPrize05_105.jpg',
      'BP_GRANDPrize06_105.jpg',
      'BP_GRANDPrize07_105.jpg'
    ];

    /* =========================================================
       BUILD URLs
    ========================================================= */
    function buildUrl(bp, file) {
      const isDir = /^subtype7_|^BP_Premium_title_|^BP_GRANDPrize/.test(file);
      const domain = isDir
        ? 'https://dl.dir.freefiremobile.com'
        : 'https://dl-tata.freefireind.in';
      return `${domain}/common/OB56/CSH/${bp}/${file}`;
    }

    /* =========================================================
       RENDER
    ========================================================= */
    function renderGrid(gridEl, bp, files) {
      gridEl.innerHTML = files.map(file => {
        const url = buildUrl(bp, file);
        return `
          <article class="item">
            <div class="item-media" data-url="${url}" data-filename="${file}" role="button" tabindex="0" aria-label="Xem ${file}">
              <img src="${url}" alt="${file}" loading="lazy"
                   onerror="this.closest('.item-media').classList.add('is-error')" />
              <div class="pending">Đang cập nhật</div>
            </div>
            <div class="item-actions">
              <button type="button" class="btn-action btn-view" data-url="${url}" data-filename="${file}" aria-label="Xem ${file}">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                Xem
              </button>
              <button type="button" class="btn-action btn-dl" data-url="${url}" data-filename="${file}" aria-label="Tải ${file}">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3v12M6 11l6 6 6-6M5 21h14"/>
                </svg>
                Tải
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    renderGrid(document.getElementById('grid-t1'), 'BP104', BP104);
    renderGrid(document.getElementById('grid-t2'), 'BP105', BP105);

    /* =========================================================
       TABS
    ========================================================= */
    (function initTabs() {
      const tabs = document.querySelectorAll('.tab');
      const panels = {
        t1: document.getElementById('panel-t1'),
        t2: document.getElementById('panel-t2')
      };

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const key = tab.dataset.tab;
          tabs.forEach(t => {
            const active = t === tab;
            t.classList.toggle('is-active', active);
            t.setAttribute('aria-selected', active ? 'true' : 'false');
          });
          Object.entries(panels).forEach(([k, el]) => {
            if (!el) return;
            el.classList.toggle('is-active', k === key);
          });
        });
      });
    })();

    /* =========================================================
       DOWNLOAD
    ========================================================= */
    async function downloadFile(url, filename, btn) {
      if (btn) btn.classList.add('is-loading');
      try {
        const res = await fetch(url, { mode: 'cors', cache: 'no-store' });
        if (!res.ok) throw new Error('fetch failed');
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
      } catch (err) {
        window.open(url, '_blank', 'noopener');
      } finally {
        if (btn) btn.classList.remove('is-loading');
      }
    }

    /* =========================================================
       MODAL
    ========================================================= */
    const modal       = document.getElementById('modal');
    const modalClose  = document.getElementById('modalClose');
    const modalMedia  = document.getElementById('modalMedia');
    const modalImg    = document.getElementById('modalImg');
    const modalFile   = document.getElementById('modalFile');
    const modalDl     = document.getElementById('modalDl');

    let currentUrl = '';
    let currentFilename = '';

    function openModal(url, filename) {
      currentUrl = url;
      currentFilename = filename;
      modalMedia.classList.remove('is-error');
      modalImg.onerror = () => modalMedia.classList.add('is-error');
      modalImg.src = url;
      modalImg.alt = filename;
      modalFile.textContent = filename;
      modalDl.dataset.url = url;
      modalDl.dataset.filename = filename;
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      setTimeout(() => {
        modalImg.src = '';
        modalMedia.classList.remove('is-error');
      }, 350);
    }

    /* Click Xem hoặc ảnh */
    document.addEventListener('click', e => {
      const trigger = e.target.closest('.btn-view, .item-media');
      if (!trigger) return;
      e.preventDefault();
      e.stopPropagation();
      openModal(trigger.dataset.url, trigger.dataset.filename);
    });

    /* Click Tải */
    document.addEventListener('click', e => {
      const btn = e.target.closest('.btn-dl');
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      downloadFile(btn.dataset.url, btn.dataset.filename, btn);
    });

    /* Modal controls */
    modalClose.addEventListener('click', closeModal);

    modalDl.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      downloadFile(currentUrl, currentFilename, modalDl);
    });

    modal.addEventListener('click', e => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
    });

    /* Hỗ trợ bàn phím cho ảnh */
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const media = e.target.closest('.item-media');
      if (!media) return;
      e.preventDefault();
      openModal(media.dataset.url, media.dataset.filename);
    });

    /* =========================================================
       CHẶN COPY
    ========================================================= */
    (function blockCopy() {
      document.addEventListener('contextmenu', e => e.preventDefault(), { passive: false });

      ['copy','cut','selectstart','dragstart'].forEach(evt => {
        document.addEventListener(evt, e => {
          const tag = (e.target && e.target.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
          e.preventDefault();
        }, { passive: false });
      });

      document.addEventListener('keydown', e => {
        const tag = (e.target && e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
        if (!(e.ctrlKey || e.metaKey)) return;
        const k = e.key.toLowerCase();
        if (k === 'c' || k === 'x' || k === 'a' || k === 'u') e.preventDefault();
      }, { passive: false });
    })();
  </script>

</body>
</html>
