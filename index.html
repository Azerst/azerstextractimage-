<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="referrer" content="no-referrer" />
  <title>AZERST — Booyah Pass</title>

  <!-- Theme init — chạy đồng bộ TRƯỚC CSS để không nháy trắng -->
  <script src="./assets/theme-init.js"></script>

  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff2">

  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>

  <!-- ============================================================
       THEME TOGGLE
       - Chỉ 1 thẻ <button> duy nhất
       - KHÔNG bọc trong <div>
       - KHÔNG dùng filter
       ============================================================ -->
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Đổi giao diện sáng / tối">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
  </button>

  <!-- BACKGROUND GLOW -->
  <div class="bg-glow" aria-hidden="true"><span class="g3"></span></div>

  <main class="page">

    <!-- HERO -->
    <header class="hero">
      <h1 class="hero-title">AZERST</h1>
      <p class="hero-sub">BOOYAH PASS GALLERY</p>
    </header>

    <!-- TABS -->
    <div class="tabs" role="tablist" aria-label="Chọn Booyah Pass">
      <button class="tab is-active" data-tab="t1" role="tab" aria-selected="true" aria-controls="panel-t1" type="button">
        <span class="tab-prefix">BOOYAH</span>
        <span class="tab-month">THÁNG 1</span>
      </button>
      <button class="tab" data-tab="t2" role="tab" aria-selected="false" aria-controls="panel-t2" type="button">
        <span class="tab-prefix">BOOYAH</span>
        <span class="tab-month">THÁNG 2</span>
      </button>
    </div>

    <!-- PANEL T1 -->
    <section class="panel is-active" id="panel-t1" role="tabpanel">
      <header class="panel-title">
        <h2>
          <span class="title-prefix">THẺ BOOYAH</span>
          <span class="title-month">THÁNG 1</span>
        </h2>
      </header>
      <div class="grid" id="grid-t1"></div>
    </section>

    <!-- PANEL T2 -->
    <section class="panel" id="panel-t2" role="tabpanel">
      <header class="panel-title">
        <h2>
          <span class="title-prefix">THẺ BOOYAH</span>
          <span class="title-month">THÁNG 2</span>
        </h2>
      </header>
      <div class="grid" id="grid-t2"></div>
    </section>

    <!-- FOOTER -->
    <footer class="page-footer">
      <p class="copy">© 2026 <strong>AZERST</strong> — ALL RIGHTS RESERVED</p>
    </footer>

  </main>

  <!-- MODAL -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-inner">
      <button class="modal-close" id="modalClose" type="button" aria-label="Đóng">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-brand">
        <span class="modal-brand-name">AZERST</span>
      </div>
      <div class="modal-media" id="modalMedia">
        <img id="modalImg" src="" alt="AZERST" />
        <div class="pending">Đang cập nhật</div>
      </div>
      <div class="modal-footer">
        <button class="modal-dl" id="modalDl" type="button" aria-label="Tải xuống">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M6 11l6 6 6-6M5 21h14"/></svg>
          Tải xuống
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- GUARD OVERLAY -->
  <div class="guard-overlay" id="guardOverlay" role="alertdialog" aria-modal="true" aria-hidden="true">
    <div class="guard-card">
      <div class="guard-icon">!</div>
      <h2 class="guard-title">PHÁT HIỆN TRUY CẬP TRÁI PHÉP</h2>
      <p class="guard-desc">Bạn đang cố mở công cụ nhà phát triển.</p>
      <div class="guard-countdown" id="guardCountdown">4</div>
      <p class="guard-note">Trang sẽ tự động tải lại sau 4 giây</p>
    </div>
  </div>

  <script src="./assets/theme.js" defer></script>
  <script src="./assets/script.js" defer></script>
  <script src="./assets/guard.js" defer></script>

</body>
</html>
