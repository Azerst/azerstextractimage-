<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f6">
<meta name="robots" content="noarchive">
<title>AZERST</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"><span class="g3"></span></div>

<main class="page">

  <header class="hero">
    <h1 class="hero-title">AZERST</h1>
    <p class="hero-sub">Free Fire Bundle Preview</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="t1" role="tab" aria-selected="true">
      <span class="tab-prefix">BOOYAH</span>
      <span class="tab-month">1</span>
    </button>
    <button class="tab" data-tab="t2" role="tab" aria-selected="false">
      <span class="tab-prefix">BOOYAH</span>
      <span class="tab-month">2</span>
    </button>
    <button class="tab" data-tab="t3" role="tab" aria-selected="false">
      <span class="tab-prefix">BOOYAH</span>
      <span class="tab-month">3</span>
    </button>
  </nav>

  <section id="panel-t1" class="panel is-active">
    <div class="panel-title">
      <h2>
        <span class="title-prefix">BOOYAH</span>
        <span class="title-month">PASS 1</span>
      </h2>
    </div>
    <div id="grid-t1" class="grid"></div>
  </section>

  <section id="panel-t2" class="panel">
    <div class="panel-title">
      <h2>
        <span class="title-prefix">BOOYAH</span>
        <span class="title-month">PASS 2</span>
      </h2>
    </div>
    <div id="grid-t2" class="grid"></div>
  </section>

  <section id="panel-t3" class="panel">
    <div class="panel-title">
      <h2>
        <span class="title-prefix">BOOYAH</span>
        <span class="title-month">PASS 3</span>
      </h2>
    </div>
    <div id="grid-t3" class="grid"></div>
  </section>

  <footer class="page-footer">
    <p class="copy"><strong>AZERST</strong> · All rights reserved</p>
  </footer>

</main>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-inner">
    <button id="modalClose" class="modal-close" aria-label="Đóng">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="modal-brand"><div class="modal-brand-name">AZERST</div></div>
    <div id="modalMedia" class="modal-media">
      <img id="modalImg" alt="AZERST" draggable="false" />
      <div class="pending">Đang cập nhật</div>
    </div>
    <div class="modal-footer">
      <button id="modalDl" class="modal-dl">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M6 11l6 6 6-6M5 21h14"/></svg>
        Tải ảnh
      </button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="guardOverlay" class="guard-overlay" aria-hidden="true">
  <div class="guard-card">
    <div class="guard-icon">!</div>
    <div class="guard-title">Phát hiện truy cập trái phép</div>
    <div class="guard-desc">Trang sẽ tự động tải lại sau</div>
    <div id="guardCountdown" class="guard-countdown">4</div>
    <div class="guard-note">Vui lòng không mở DevTools</div>
  </div>
</div>

<script src="security.js"></script>
<script src="guard.js"></script>
<script src="script.js"></script>
</body>
</html></html>
