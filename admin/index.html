<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>AZERST · Login</title>
<link rel="stylesheet" href="./admin.css">
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<section class="screen screen--login">
  <form id="loginForm" class="login-card" autocomplete="off" novalidate>
    <div class="login-logo" aria-hidden="true">
      <span class="logo-mark">A</span>
      <span class="logo-glow"></span>
    </div>
    <h1 class="login-title">CONTROL PANEL</h1>
    <p class="login-sub">Azerst · Restricted Access</p>

    <div class="field">
      <label for="loginUser">Tài khoản</label>
      <input id="loginUser" type="text" spellcheck="false" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="loginPass">Mật khẩu</label>
      <div class="pw-wrap">
        <input id="loginPass" type="password" autocomplete="current-password" required>
        <button type="button" id="togglePw" aria-label="Hiện / Ẩn" tabindex="-1">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="loginError" class="error" role="alert" hidden></div>

    <button type="submit" class="btn-primary" id="loginBtn"><span>ĐĂNG NHẬP</span></button>
    <p class="login-note">Phiên đăng nhập sẽ kết thúc khi đóng tab.</p>
  </form>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./auth.js"></script>
<script>
(function () {
  'use strict';
  console.log('[Login] Loaded');

  if (AZERST_AUTH.isLoggedIn()) {
    location.replace('dashboard.html');
    return;
  }

  var dom = {
    form: document.getElementById('loginForm'),
    user: document.getElementById('loginUser'),
    pass: document.getElementById('loginPass'),
    err: document.getElementById('loginError'),
    toggle: document.getElementById('togglePw'),
    toast: document.getElementById('toast')
  };

  var toastTimer;
  function toast(msg, type) {
    clearTimeout(toastTimer);
    dom.toast.textContent = msg;
    dom.toast.className = 'toast is-show ' + (type || '');
    toastTimer = setTimeout(function () { dom.toast.classList.remove('is-show'); }, 2800);
  }

  function showError(msg) {
    dom.err.textContent = msg;
    dom.err.hidden = false;
    dom.err.style.animation = 'none';
    void dom.err.offsetWidth;
    dom.err.style.animation = '';
  }
  function clearError() { dom.err.hidden = true; }

  dom.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var r = AZERST_AUTH.lockRemaining();
    if (r > 0) { showError('Đã khóa. Vui lòng thử lại sau ' + r + 's.'); return; }
    var user = dom.user.value.trim();
    var pass = dom.pass.value;
    if (!user || !pass) { showError('Vui lòng nhập đầy đủ tài khoản và mật khẩu.'); return; }
    var res = AZERST_AUTH.login(user, pass);
    if (res.ok) {
      clearError();
      toast('Đăng nhập thành công', 'success');
      setTimeout(function () { location.replace('dashboard.html'); }, 400);
    } else {
      var f = AZERST_AUTH.recordFail();
      if (f.locked) showError('Sai quá 5 lần. Đã khóa 60 giây.');
      else showError('Sai tài khoản hoặc mật khẩu (' + f.attempts + '/5).');
    }
  });

  dom.form.addEventListener('input', clearError);

  dom.toggle.addEventListener('click', function () {
    var isPw = dom.pass.type === 'password';
    dom.pass.type = isPw ? 'text' : 'password';
  });

  var r0 = AZERST_AUTH.lockRemaining();
  if (r0 > 0) showError('Đã khóa. Vui lòng thử lại sau ' + r0 + 's.');

  dom.user.focus();
})();
</script>
</body>
</html>
