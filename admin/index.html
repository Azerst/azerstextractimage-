<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Đăng nhập — AZERST Admin</title>
  <link rel="stylesheet" href="./admin.css" />
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="login-brand-mark">A</span>
        <div class="login-brand-text">
          <h1>AZERST</h1>
          <p>ADMIN PANEL</p>
        </div>
      </div>

      <form id="loginForm" class="login-form" autocomplete="off">
        <label class="login-field">
          <span class="login-label">Tài khoản</span>
          <input type="text" id="loginUser" class="login-input" placeholder="Nhập tài khoản admin" autocomplete="off" spellcheck="false" required />
        </label>
        <label class="login-field">
          <span class="login-label">Mật khẩu</span>
          <input type="password" id="loginPass" class="login-input" placeholder="Nhập mật khẩu" autocomplete="off" required />
        </label>
        <div class="login-error" id="loginError" role="alert" aria-live="polite"></div>
        <button type="submit" class="login-btn" id="loginBtn">ĐĂNG NHẬP</button>
      </form>

      <a href="../index.html" class="login-back">← Về trang chủ</a>
    </div>
  </div>

  <script src="./auth.js" defer></script>
</body>
</html>
