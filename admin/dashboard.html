<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>AZERST · Dashboard</title>
<link rel="stylesheet" href="./admin.css">
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<section class="screen">
  <header class="admin-header">
    <div class="brand">
      <span class="brand-mark">A</span>
      <div class="brand-text">
        <strong>AZERST</strong>
        <small>Control Panel</small>
      </div>
    </div>
    <div class="header-actions">
      <a class="btn-outline" href="../" target="_blank" rel="noopener">Xem trang</a>
      <button id="logoutBtn" class="btn-outline danger">Đăng xuất</button>
    </div>
  </header>

  <main class="admin-main">
    <section class="card">
      <header class="card-head">
        <h2>Cấu hình chung</h2>
        <p class="hint">Domain + đường dẫn dùng để build URL ảnh mặc định.</p>
      </header>
      <div class="grid-3">
        <div class="field">
          <label for="cfgDomainFile">Domain ảnh thường</label>
          <input id="cfgDomainFile" type="url" spellcheck="false">
        </div>
        <div class="field">
          <label for="cfgDomainDir">Domain ảnh đặc biệt</label>
          <input id="cfgDomainDir" type="url" spellcheck="false">
        </div>
        <div class="field">
          <label for="cfgPath">Đường dẫn</label>
          <input id="cfgPath" type="text" spellcheck="false">
        </div>
      </div>
    </section>

    <section class="card">
      <header class="card-head">
        <h2>Quản lý ảnh BOOYAH</h2>
        <p class="hint">Sửa URL ảnh hoặc để trống dùng mặc định.</p>
      </header>
      <div class="tabs" role="tablist">
        <button type="button" class="tab is-active" data-bp="BP104" role="tab">BOOYAH <strong>1</strong></button>
        <button type="button" class="tab" data-bp="BP105" role="tab">BOOYAH <strong>2</strong></button>
        <button type="button" class="tab" data-bp="BP106" role="tab">BOOYAH <strong>3</strong></button>
      </div>
      <div class="toolbar">
        <span class="count" id="imageCount">0 ảnh</span>
        <button type="button" class="btn-small" id="addImageBtn">+ Thêm ảnh</button>
      </div>
      <div id="imageGrid" class="image-grid"></div>
    </section>

    <section class="card">
      <div class="actions">
        <button id="saveBtn" class="btn-primary">Lưu cấu hình</button>
        <button id="resetBtn" class="btn-danger">Reset về mặc định</button>
        <button id="exportBtn" class="btn-outline">Export JSON</button>
        <label class="btn-outline" for="importInput">Import JSON</label>
        <input id="importInput" type="file" accept="application/json,.json" hidden>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="admin-footer">
    <p>AZERST · Admin v1.2</p>
  </footer>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./auth.js"></script>
<script>
(function () {
  'use strict';

  if (!AZERST_AUTH.isLoggedIn()) {
    location.replace('index.html');
    return;
  }

  console.log('[Dashboard] Loaded');

  const CFG_KEY = 'azerst_config';
  const SESSION_TIMEOUT_MS = 30 * 60 * 1000;

  const DEFAULT_FILES = {
    BP104: ['BP_Prize_104.png','BP_Task_FP_104.png','BP_104.png','BP_Window_PP_104.png','BP_Premium_icon_104.png','BP_Icon_free_104.png','subtype36_104.jpg','subtype1_104.jpg','subtype2_104.jpg','subtype3_104.jpg','subtype7_104.jpg','BP_Premium_title_104.png','BP_GRANDPrize01_104.jpg','BP_GRANDPrize02_104.jpg','BP_GRANDPrize03_104.jpg','BP_GRANDPrize04_104.jpg','BP_GRANDPrize05_104.jpg','BP_GRANDPrize06_104.jpg'],
    BP105: ['BP_Prize_105.png','BP_Task_FP_105.png','BP_105.png','BP_Window_PP_105.png','BP_Premium_icon_105.png','BP_Icon_free_105.png','subtype36_105.jpg','subtype1_105.jpg','subtype2_105.jpg','subtype3_105.jpg','subtype7_105.jpg','BP_Premium_title_105.png','BP_GRANDPrize01_105.jpg','BP_GRANDPrize02_105.jpg','BP_GRANDPrize03_105.jpg','BP_GRANDPrize04_105.jpg','BP_GRANDPrize05_105.jpg','BP_GRANDPrize06_105.jpg','BP_GRANDPrize07_105.jpg'],
    BP106: ['BP_Prize_106.png','BP_Task_FP_106.png','BP_106.png','BP_Window_PP_106.png','BP_Premium_icon_106.png','BP_Icon_free_106.png','subtype36_106.jpg','subtype1_106.jpg','subtype2_106.jpg','subtype3_106.jpg','subtype7_106.jpg','BP_Premium_title_106.png','BP_GRANDPrize01_106.jpg','BP_GRANDPrize02_106.jpg','BP_GRANDPrize03_106.jpg','BP_GRANDPrize04_106.jpg','BP_GRANDPrize05_106.jpg','BP_GRANDPrize06_106.jpg','BP_GRANDPrize07_106.jpg']
  };
  const BP_KEYS = ['BP104','BP105','BP106'];
  const DEFAULT_CFG = { domainFile: 'https://dl-tata.freefireind.in', domainDir: 'https://dl.dir.freefiremobile.com', path: 'common/OB56/CSH' };

  var state = { cfg: null, activeBp: 'BP104' };
  var dom = {};
  function $(id) { return document.getElementById(id); }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function debounce(fn, ms) {
    var t;
    return function () {
      var a = arguments, c = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(c, a); }, ms);
    };
  }

  var toastTimer = null;
  function toast(msg, type) {
    var el = dom.toast;
    if (!el) return;
    clearTimeout(toastTimer);
    el.textContent = msg;
    el.className = 'toast is-show ' + (type || 'info');
    toastTimer = setTimeout(function () { el.classList.remove('is-show'); }, 2800);
  }

  function setStatus(msg, type) {
    if (!dom.status) return;
    dom.status.textContent = msg;
    dom.status.className = 'status ' + (type || '');
  }

  function cloneDefault() {
    return {
      domainFile: DEFAULT_CFG.domainFile,
      domainDir: DEFAULT_CFG.domainDir,
      path: DEFAULT_CFG.path,
      files: {
        BP104: DEFAULT_FILES.BP104.slice(),
        BP105: DEFAULT_FILES.BP105.slice(),
        BP106: DEFAULT_FILES.BP106.slice()
      },
      overrides: {}
    };
  }

  function loadCfg() {
    try {
      var raw = localStorage.getItem(CFG_KEY);
      if (!raw) return cloneDefault();
      var d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return cloneDefault();
      var cfg = cloneDefault();
      if (typeof d.domainFile === 'string') cfg.domainFile = d.domainFile;
      if (typeof d.domainDir === 'string') cfg.domainDir = d.domainDir;
      if (typeof d.path === 'string') cfg.path = d.path;
      if (d.files && typeof d.files === 'object') {
        BP_KEYS.forEach(function (bp) {
          if (Array.isArray(d.files[bp])) {
            cfg.files[bp] = d.files[bp].filter(function (x) { return typeof x === 'string'; });
          }
        });
      }
      if (d.overrides && typeof d.overrides === 'object') {
        cfg.overrides = {};
        Object.keys(d.overrides).forEach(function (k) {
          if (typeof d.overrides[k] === 'string') cfg.overrides[k] = d.overrides[k];
        });
      }
      return cfg;
    } catch (e) { return cloneDefault(); }
  }

  function saveCfg(cfg) {
    try {
      localStorage.setItem(CFG_KEY, JSON.stringify({
        domainFile: cfg.domainFile, domainDir: cfg.domainDir,
        path: cfg.path, files: cfg.files,
        overrides: cfg.overrides, updatedAt: Date.now()
      }));
      return true;
    } catch (e) { toast('Không lưu được', 'error'); return false; }
  }

  function buildDefaultUrl(bp, file) {
    if (!file) return '';
    var cfg = state.cfg;
    var isDir = /^subtype7_|^BP_Premium_title_|^BP_GRANDPrize/.test(file);
    var domain = isDir ? cfg.domainDir : cfg.domainFile;
    return domain + '/' + cfg.path + '/' + bp + '/' + file;
  }

  function buildEffectiveUrl(bp, file) {
    var key = bp + '/' + file;
    return (state.cfg.overrides[key]) || buildDefaultUrl(bp, file);
  }

  function renderSettings() {
    dom.cfgDomainFile.value = state.cfg.domainFile;
    dom.cfgDomainDir.value = state.cfg.domainDir;
    dom.cfgPath.value = state.cfg.path;
  }

  function renderTabs() {
    dom.tabs.forEach(function (tab) {
      var active = tab.dataset.bp === state.activeBp;
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
    });
  }

  function renderImageGrid() {
    var bp = state.activeBp;
    var files = state.cfg.files[bp] || [];
    var grid = dom.imageGrid;
    dom.imageCount.textContent = files.length + ' ảnh';
    if (!files.length) {
      grid.innerHTML = '<div class="empty-state">Chưa có ảnh. Bấm "+ Thêm ảnh" để tạo.</div>';
      return;
    }
    grid.innerHTML = files.map(function (file, index) {
      var isNew = !file;
      var effectiveUrl = isNew ? '' : buildEffectiveUrl(bp, file);
      var overrideUrl = isNew ? '' : (state.cfg.overrides[bp + '/' + file] || '');
      return (
        '<div class="image-card" data-index="' + index + '">' +
          '<button type="button" class="image-remove" title="Xóa">×</button>' +
          '<div class="image-preview">' +
            (effectiveUrl ? '<img src="' + escapeHtml(effectiveUrl) + '" alt="" loading="lazy">' : '') +
            '<div class="preview-error">' + (isNew ? 'Nhập tên file' : 'Lỗi tải ảnh') + '</div>' +
          '</div>' +
          '<div class="image-info">' +
            (isNew
              ? '<input class="image-filename-input" type="text" placeholder="Tên file..." autofocus>'
              : '<div class="image-filename" title="' + escapeHtml(file) + '">' + escapeHtml(file) + '</div>') +
            '<input class="image-url" type="url" value="' + escapeHtml(overrideUrl) + '" placeholder="' + (isNew ? 'URL tùy chỉnh...' : 'Trống = mặc định') + '" ' + (isNew ? 'disabled' : '') + '>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    var n = grid.querySelector('.image-filename-input');
    if (n) setTimeout(function () { n.focus(); }, 30);
  }

  function updatePreview(card, bp, file) {
    var img = card.querySelector('img');
    var prev = card.querySelector('.image-preview');
    var url = buildEffectiveUrl(bp, file);
    if (!url) return;
    if (!img) {
      img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      prev.insertBefore(img, prev.firstChild);
    }
    prev.classList.remove('is-error');
    img.src = url;
  }

  function onGridInput(e) {
    var t = e.target;
    var card = t.closest('.image-card');
    if (!card) return;
    var i = Number(card.dataset.index);
    var bp = state.activeBp;
    var file = state.cfg.files[bp][i];
    if (!file) return;
    if (t.classList.contains('image-url')) {
      var key = bp + '/' + file;
      var url = t.value.trim();
      if (url) state.cfg.overrides[key] = url;
      else delete state.cfg.overrides[key];
      updatePreview(card, bp, file);
    }
  }

  function onGridChange(e) {
    var t = e.target;
    var card = t.closest('.image-card');
    if (!card) return;
    var i = Number(card.dataset.index);
    var bp = state.activeBp;
    if (t.classList.contains('image-filename-input')) {
      var nf = t.value.trim();
      if (!nf) { state.cfg.files[bp].splice(i, 1); renderImageGrid(); return; }
      state.cfg.files[bp][i] = nf;
      renderImageGrid();
    }
  }

  function onGridClick(e) {
    var t = e.target;
    var card = t.closest('.image-card');
    if (!card) return;
    var i = Number(card.dataset.index);
    var bp = state.activeBp;
    if (t.classList.contains('image-remove')) {
      var file = state.cfg.files[bp][i];
      if (!confirm('Xóa ảnh "' + (file || '?') + '"?')) return;
      state.cfg.files[bp].splice(i, 1);
      if (file) delete state.cfg.overrides[bp + '/' + file];
      renderImageGrid();
    }
  }

  function onGridError(e) {
    if (e.target && e.target.tagName === 'IMG') {
      var prev = e.target.closest('.image-preview');
      if (prev) prev.classList.add('is-error');
    }
  }

  function handleAddImage() {
    state.cfg.files[state.activeBp].push('');
    renderImageGrid();
  }

  function handleSave() {
    BP_KEYS.forEach(function (bp) {
      state.cfg.files[bp] = state.cfg.files[bp]
        .map(function (f) { return (f || '').trim(); })
        .filter(Boolean);
    });
    if (saveCfg(state.cfg)) {
      renderImageGrid();
      toast('Đã lưu cấu hình', 'success');
      setStatus('Đã lưu lúc ' + new Date().toLocaleTimeString(), 'ok');
    }
  }

  function handleReset() {
    if (!confirm('Reset toàn bộ cấu hình về mặc định?')) return;
    try { localStorage.removeItem(CFG_KEY); } catch (e) {}
    state.cfg = cloneDefault();
    state.activeBp = 'BP104';
    renderSettings();
    renderTabs();
    renderImageGrid();
    toast('Đã reset', 'warning');
    setStatus('Đã reset');
  }

  function handleExport() {
    var cfg = {
      domainFile: state.cfg.domainFile, domainDir: state.cfg.domainDir,
      path: state.cfg.path, files: state.cfg.files,
      overrides: state.cfg.overrides, updatedAt: Date.now()
    };
    var blob = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'azerst-config-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast('Đã export', 'success');
  }

  function handleImport(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var d = JSON.parse(e.target.result);
        if (!d || typeof d !== 'object') throw new Error('Invalid');
        var cfg = cloneDefault();
        if (typeof d.domainFile === 'string') cfg.domainFile = d.domainFile;
        if (typeof d.domainDir === 'string') cfg.domainDir = d.domainDir;
        if (typeof d.path === 'string') cfg.path = d.path;
        if (d.files && typeof d.files === 'object') {
          BP_KEYS.forEach(function (bp) {
            if (Array.isArray(d.files[bp])) {
              cfg.files[bp] = d.files[bp].filter(function (x) { return typeof x === 'string' && x.trim(); });
            }
          });
        }
        if (d.overrides && typeof d.overrides === 'object') {
          Object.keys(d.overrides).forEach(function (k) {
            if (typeof d.overrides[k] === 'string') cfg.overrides[k] = d.overrides[k];
          });
        }
        state.cfg = cfg;
        renderSettings();
        renderTabs();
        renderImageGrid();
        toast('Đã import', 'success');
        setStatus('Đã import lúc ' + new Date().toLocaleTimeString(), 'ok');
      } catch (err) { toast('File JSON không hợp lệ', 'error'); }
    };
    reader.readAsText(file);
  }

  function onSettingsChange() {
    state.cfg.domainFile = dom.cfgDomainFile.value.trim() || DEFAULT_CFG.domainFile;
    state.cfg.domainDir = dom.cfgDomainDir.value.trim() || DEFAULT_CFG.domainDir;
    state.cfg.path = dom.cfgPath.value.trim() || DEFAULT_CFG.path;
    var cards = dom.imageGrid.querySelectorAll('.image-card');
    cards.forEach(function (card) {
      var i = Number(card.dataset.index);
      var file = state.cfg.files[state.activeBp][i];
      if (!file) return;
      if (state.cfg.overrides[state.activeBp + '/' + file]) return;
      updatePreview(card, state.activeBp, file);
    });
  }

  function doLogout() {
    stopIdleMonitor();
    AZERST_AUTH.logout();
    location.replace('index.html');
  }

  var lastActivityAt = Date.now();
  var idleTimer = null;
  function touchActivity() { lastActivityAt = Date.now(); }
  ['mousemove','keydown','click','touchstart','scroll'].forEach(function (evt) {
    document.addEventListener(evt, touchActivity, { passive: true });
  });
  function startIdleMonitor() {
    stopIdleMonitor();
    lastActivityAt = Date.now();
    idleTimer = setInterval(function () {
      if (Date.now() - lastActivityAt > SESSION_TIMEOUT_MS) {
        toast('Phiên hết hạn do không hoạt động', 'warning');
        setTimeout(function () { doLogout(); }, 1500);
      }
    }, 30000);
  }
  function stopIdleMonitor() {
    if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
  }

  function cacheDom() {
    dom = {
      logoutBtn: $('logoutBtn'),
      cfgDomainFile: $('cfgDomainFile'),
      cfgDomainDir: $('cfgDomainDir'),
      cfgPath: $('cfgPath'),
      tabs: Array.prototype.slice.call(document.querySelectorAll('.tab[data-bp]')),
      imageGrid: $('imageGrid'),
      imageCount: $('imageCount'),
      addImageBtn: $('addImageBtn'),
      saveBtn: $('saveBtn'),
      resetBtn: $('resetBtn'),
      exportBtn: $('exportBtn'),
      importInput: $('importInput'),
      status: $('status'),
      toast: $('toast')
    };
  }

  function bindEvents() {
    dom.logoutBtn.addEventListener('click', doLogout);
    dom.tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        state.activeBp = tab.dataset.bp;
        renderTabs();
        renderImageGrid();
      });
    });
    dom.addImageBtn.addEventListener('click', handleAddImage);
    dom.imageGrid.addEventListener('input', onGridInput);
    dom.imageGrid.addEventListener('change', onGridChange);
    dom.imageGrid.addEventListener('click', onGridClick);
    dom.imageGrid.addEventListener('error', onGridError, true);
    var s = debounce(onSettingsChange, 300);
    dom.cfgDomainFile.addEventListener('input', s);
    dom.cfgDomainDir.addEventListener('input', s);
    dom.cfgPath.addEventListener('input', s);
    dom.saveBtn.addEventListener('click', handleSave);
    dom.resetBtn.addEventListener('click', handleReset);
    dom.exportBtn.addEventListener('click', handleExport);
    dom.importInput.addEventListener('change', function (e) {
      handleImport(e.target.files && e.target.files[0]);
      e.target.value = '';
    });
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        handleSave();
      }
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      if (!AZERST_AUTH.isLoggedIn()) location.replace('index.html');
    });
  }

  function init() {
    try {
      cacheDom();
      bindEvents();
      state.cfg = loadCfg();
      state.activeBp = 'BP104';
      renderSettings();
      renderTabs();
      renderImageGrid();
      setStatus('Đã nạp cấu hình');
      startIdleMonitor();
      console.log('[Dashboard] Init complete');
    } catch (err) {
      console.error('[Dashboard] Init failed:', err);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
