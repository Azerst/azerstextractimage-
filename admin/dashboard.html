<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard — AZERST Admin</title>
  <link rel="stylesheet" href="./admin.css" />
</head>
<body class="dash-body">

  <header class="dash-header">
    <div class="dash-brand">
      <span class="dash-brand-mark">A</span>
      <div>
        <h1>AZERST ADMIN</h1>
        <p>QUẢN LÝ BOOYAH PASS</p>
      </div>
    </div>
    <div class="dash-actions">
      <a href="../index.html" class="dash-btn dash-btn-ghost">← Trang chủ</a>
      <button type="button" class="dash-btn dash-btn-danger" id="logoutBtn">Đăng xuất</button>
    </div>
  </header>

  <main class="dash-main">
    <div class="dash-warn">
      ⚠️ Thay đổi lưu vào <strong>localStorage</strong> của trình duyệt này. Người dùng thiết bị khác sẽ không thấy thay đổi.
    </div>

    <div class="dash-toolbar">
      <button type="button" class="dash-btn dash-btn-primary" id="saveAllBtn">💾 Lưu tất cả</button>
      <button type="button" class="dash-btn" id="exportBtn">📤 Xuất JSON</button>
      <button type="button" class="dash-btn" id="importBtn">📥 Nhập JSON</button>
      <button type="button" class="dash-btn dash-btn-warning" id="resetBtn">🔄 Reset mặc định</button>
      <input type="file" id="importFile" accept="application/json" hidden />
    </div>

    <div class="dash-tabs">
      <button type="button" class="dash-tab is-active" data-month="BP104">THÁNG 1</button>
      <button type="button" class="dash-tab" data-month="BP105">THÁNG 2</button>
      <button type="button" class="dash-tab" data-month="BP106">THÁNG 3</button>
    </div>

    <div class="dash-status" id="statusBar"></div>
    <div class="dash-editor" id="editorArea"></div>
  </main>

  <div class="dash-toast" id="toast"></div>
  <script src="./auth.js" defer></script>
</body>
</html>
